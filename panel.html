<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Clínico - Glow Up Boutique</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="panel" id="panelView" style="display: block;">
        <div class="panel-header">
            <div class="brand-header">
                <img src="imagenes/logo.png" alt="Logo" class="mini-logo-img">
                <h2>GLOW UP BOUTIQUE</h2>
            </div>
            <button class="btn-logout" id="btnLogout">Cerrar Sesión</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="buscar">Buscar Cliente</button>
            <button class="tab-btn" data-tab="nuevo">Ingresar Cliente Nuevo</button>
        </div>

        <div class="tab-content active" id="tab-buscar">
            <div class="form-group">
                <label for="buscarRut">Ingrese RUT del cliente</label>
                <input type="text" id="buscarRut" placeholder="Ej: 12.345.678-9">
            </div>
            <button class="btn-primary" id="btnBuscar">BUSCAR CLIENTE</button>
            <div class="error-msg" id="errorBuscar"></div>
            <div id="contenedorFicha"></div>
        </div>

        <div class="tab-content" id="tab-nuevo">
            <form id="formNuevo">
                <h3>Datos Personales</h3>
                <div class="form-row">
                    <div class="form-group"><label for="nNombre">Nombre Completo</label><input type="text" id="nNombre" required></div>
                    <div class="form-group"><label for="nRut">RUT</label><input type="text" id="nRut" placeholder="Ej: 11.222.333-4" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label for="nEdad">Edad</label><input type="number" id="nEdad" required></div>
                    <div class="form-group"><label for="nTelefono">Teléfono</label><input type="text" id="nTelefono" required></div>
                </div>
                <div class="form-group"><label for="nEmail">Email</label><input type="email" id="nEmail" required></div>
                <h3>Datos Cosmetológicos</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="nPiel">Tipo de Piel</label>
                        <select id="nPiel" required><option value="Normal">Normal</option><option value="Seca">Seca</option><option value="Grasa">Grasa</option><option value="Mixta">Mixta</option><option value="Sensible">Sensible</option></select>
                    </div>
                    <div class="form-group"><label for="nAlergias">Alergias</label><input type="text" id="nAlergias" required></div>
                </div>

                <div class="form-group" style="display: flex; align-items: flex-start; gap: 10px; margin-top: 15px; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #eee;">
                    <input type="checkbox" id="nConsentimiento" required style="width: auto; margin-top: 4px; accent-color: #d4af37;">
                    <label for="nConsentimiento" style="font-size: 12px; color: #555; line-height: 1.4; text-transform: none; letter-spacing: 0;">
                        Autorizo el tratamiento de mis datos sensibles (salud, piel, alergias) para fines de diagnóstico y tratamiento estético, conforme a la <a href="privacidad.html" target="_blank" style="color: #8e24aa;">Política de Privacidad</a>.
                    </label>
                </div>

                <button type="submit" class="btn-primary">GUARDAR CLIENTE</button>
                <div class="success-msg" id="msgNuevo"></div>
            </form>

            <div class="listado">
                <h3>Clientes Registrados</h3>
                <div id="listaClientes" class="lista-clientes"></div>
            </div>
        </div>
    </div>

    <div class="vista-ficha" id="vistaFichaCompleta">
        <div class="ficha-papel">
            <div class="ficha-header-print">
                <div class="ficha-logo">GLOW UP <span>BOUTIQUE</span></div>
                <div class="ficha-titulo"><h2>DIAGNÓSTICO FACIAL</h2></div>
                <div class="ficha-logo">GLOW UP <span>BOUTIQUE</span></div>
            </div>
            <form id="formDiagnosticoAnesi">
                <input type="hidden" id="diagRut"><input type="hidden" id="diagId">
                <div class="seccion-ficha">
                    <h4>DATOS DEL CLIENTE</h4>
                    <div class="form-group-inline"><label>Nombre:</label><input type="text" id="dNombre" readonly class="input-print"></div>
                    <div class="form-group-inline"><label>Tel:</label><input type="text" id="dTelefono" readonly class="input-print"></div>
                </div>
                <div class="acciones-ficha">
                    <button type="button" class="btn-cancelar" id="btnCerrarFicha">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar Diagnóstico</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="modalEliminar">
        <div class="modal-content" style="text-align: center; max-width: 400px;">
            <h3 style="color: #e53935;" id="modalEliminarTitle">⚠️ Eliminar</h3>
            <p id="modalEliminarText">¿Estás seguro?</p>
            <div style="display: flex; gap: 10px;">
                <button class="btn-cancelar" id="btnCancelarEliminar" style="flex: 1;">Cancelar</button>
                <button class="btn-primary" id="btnConfirmarEliminar" style="flex: 1; background: #e53935; color:#fff; border:none;">Sí, eliminar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAynA1pU1npXEN_HvXNxTC4Xn7QB_SWyWg",
            authDomain: "glow-up-boutique-bdc0c.firebaseapp.com",
            projectId: "glow-up-boutique-bdc0c",
            storageBucket: "glow-up-boutique-bdc0c.firebasestorage.app",
            messagingSenderId: "372481623830",
            appId: "1:372481623830:web:e93a695c930f6a934ef237"
        };

        const app = initializeApp(firebaseConfig);
        window.firebaseDB = getFirestore(app); window.firebaseAuth = getAuth(app);
        const script = document.createElement('script'); script.src = "script.js"; script.type = "module"; document.body.appendChild(script);
    </script>
</body>
</html>
