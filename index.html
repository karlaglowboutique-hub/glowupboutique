<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Glow Up Boutique</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="login-container" id="loginView">
        <div class="logo-container">
            <img src="imagenes/logo.png" alt="Glow Up Boutique" class="logo-img">
            <h1>GLOW UP<br><span>BOUTIQUE</span></h1>
            <p>Panel de Administración</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Ingrese su nombre" required>
            </div>
            <div class="form-group">
                <label for="rut">RUT</label>
                <input type="text" id="rut" placeholder="Ej: 12.345.678-9" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingrese su contraseña" required>
            </div>
            <button type="submit" class="btn-login">INGRESAR</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
