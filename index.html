<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Glow Up Boutique</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container" id="loginView">
        <div class="logo-container">
            <img src="imagenes/logo.png" alt="Glow Up Boutique" class="logo-img">
            <h1>GLOW UP<br><span>BOUTIQUE</span></h1>
            <p>Panel de Administración</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="tu@correo.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Tu contraseña" required>
            </div>
            <button type="submit" class="btn-login">INGRESAR</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAynA1pU1npXEN_HvXNxTC4Xn7QB_SWyWg",
            authDomain: "glow-up-boutique-bdc0c.firebaseapp.com",
            projectId: "glow-up-boutique-bdc0c",
            storageBucket: "glow-up-boutique-bdc0c.firebasestorage.app",
            messagingSenderId: "372481623830",
            appId: "1:372481623830:web:e93a695c930f6a934ef237"
        };

        const app = initializeApp(firebaseConfig);
        window.firebaseDB = getFirestore(app);
        window.firebaseAuth = getAuth(app);
        
        const script = document.createElement('script');
        script.src = "script.js"; script.type = "module"; document.body.appendChild(script);
    </script>
</body>
</html>
