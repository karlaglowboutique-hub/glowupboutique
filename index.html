<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso - Glow Up Boutique</title>
    <link rel="icon" type="image/png" href="imagenes/icon-192.png">
        <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Glow Up">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="imagenes/apple-touch-icon.png">
    <script src="js/pwa.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="login-container" id="loginView">
        <div class="logo-container">
            <img src="imagenes/logo.png" alt="" class="logo-img" onerror="this.style.display='none'">
            <h1>GLOW UP<br><span>BOUTIQUE</span></h1>
            <p>Panel de administración</p>
        </div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login" id="btnLogin">INGRESAR</button>
            <div class="error-msg" id="errorMsg" role="alert" aria-live="polite"></div>
            <button type="button" class="btn-link" id="btnOlvide">¿Olvidaste tu contraseña?</button>
                        <button type="button" class="btn-link" id="btnInstalar" hidden>📲 Instalar aplicación</button>
        </form>

        <p class="pie-legal"><a href="privacidad.html">Política de privacidad</a></p>
    </main>

    <script type="module" src="js/login.js"></script>
</body>
</html>
