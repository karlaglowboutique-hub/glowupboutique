<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Glow Up Boutique</title>
    <link rel="icon" type="image/png" href="imagenes/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Glow Up">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="imagenes/apple-touch-icon.png">
    <script src="js/pwa.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="cargando">

    <main class="panel panel-prog">
        <div class="panel-header">
            <h1>⚙️ Panel del programador</h1>
            <button type="button" class="btn-logout" id="btnSalirProg" hidden>Cerrar sesión</button>
        </div>

        <!-- Inicio de sesión del programador -->
        <div id="loginProgBox" class="login-prog">
            <form id="formLoginProg" novalidate>
                <div class="form-group">
                    <label for="pEmail">Correo (programador)</label>
                    <input type="email" id="pEmail" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="pPass">Contraseña</label>
                    <input type="password" id="pPass" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-primary" id="btnLoginProg">Desbloquear acceso</button>
                <div class="error-msg" id="errorProg" role="alert" aria-live="polite"></div>
            </form>
            <p class="pie-legal"><a href="panel.html">Volver al panel clínico</a></p>
        </div>

        <!-- Lista de clientes (solo tras iniciar sesión como programador) -->
        <div id="dashboardProg" hidden>
            <h2>Base de datos en la nube</h2>
            <div id="listaClientesProg" class="lista-prog"></div>
        </div>
    </main>

    <!-- Modal editar cliente -->
    <div class="modal-overlay" id="modalEditarProg">
        <div class="modal-content modal-editar" role="dialog" aria-modal="true" aria-labelledby="tituloEditarProg">
            <h2 class="modal-titulo" id="tituloEditarProg">✏️ Editar cliente (base de datos)</h2>
            <form id="formEditarProg" autocomplete="off" novalidate>
                <input type="hidden" id="epRutOriginal">
                <div class="form-row">
                    <div class="form-group">
                        <label for="epNombre">Nombre</label>
                        <input type="text" id="epNombre" required>
                    </div>
                    <div class="form-group">
                        <label for="epRut">RUT</label>
                        <input type="text" id="epRut" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="epEdad">Edad</label>
                        <input type="number" id="epEdad" min="0" max="120" step="1" required>
                    </div>
                    <div class="form-group">
                        <label for="epTelefono">Teléfono</label>
                        <input type="tel" id="epTelefono" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="epEmail">Email</label>
                    <input type="email" id="epEmail" required>
                </div>
                <div class="form-group">
                    <label for="epAlergias">Alergias</label>
                    <input type="text" id="epAlergias" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="epMorbidos">Enfermedades</label>
                        <input type="text" id="epMorbidos">
                    </div>
                    <div class="form-group">
                        <label for="epMedicamentos">Medicamentos</label>
                        <input type="text" id="epMedicamentos">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="epEmbarazo">Embarazo / lactancia</label>
                        <select id="epEmbarazo">
                            <option value="No">No</option>
                            <option value="Sí">Sí</option>
                            <option value="No aplica">No aplica</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="epPiel">Tipo de piel</label>
                        <select id="epPiel">
                            <option value="Normal">Normal</option>
                            <option value="Seca">Seca</option>
                            <option value="Grasa">Grasa</option>
                            <option value="Mixta">Mixta</option>
                            <option value="Sensible">Sensible</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="epFototipo">Fototipo</label>
                        <select id="epFototipo">
                            <option value="I">I</option>
                            <option value="II">II</option>
                            <option value="III">III</option>
                            <option value="IV">IV</option>
                            <option value="V">V</option>
                            <option value="VI">VI</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="epCirugias">Cirugías previas</label>
                        <input type="text" id="epCirugias">
                    </div>
                </div>
                <div class="error-msg" id="errorEditarProg" role="alert" aria-live="polite"></div>
                <div class="modal-botones">
                    <button type="button" class="btn-cancelar" id="btnCerrarEditarProg">Cancelar</button>
                    <button type="submit" class="btn-primary btn-inline btn-grow" id="btnGuardarEditarProg">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal eliminar -->
    <div class="modal-overlay" id="modalEliminar">
        <div class="modal-content modal-confirm" role="dialog" aria-modal="true" aria-labelledby="modalEliminarTitle" aria-describedby="modalEliminarText">
            <h2 class="modal-titulo" id="modalEliminarTitle">⚠️ Borrar de la base de datos</h2>
            <p class="modal-texto" id="modalEliminarText">¿Estás seguro?</p>
            <div class="error-msg" id="modalEliminarError" role="alert"></div>
            <div class="modal-botones">
                <button type="button" class="btn-cancelar" id="btnCancelarEliminar">Cancelar</button>
                <button type="button" class="btn-primary btn-peligro btn-inline btn-grow" id="btnConfirmarEliminar">Sí, borrar</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/programador.js"></script>
</body>
</html>
