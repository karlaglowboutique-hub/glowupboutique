<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Glow Up Boutique</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos extra para el panel del programador */
        body { background: #0a0a0a; }
        .panel { max-width: 1000px; }
        .admin-card { background: #fff; border: 1px solid #ddd; border-left: 5px solid #111; border-radius: 8px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .admin-card .info strong { display: block; color: #111; font-size: 15px; }
        .admin-card .info span { color: #777; font-size: 12px; }
        .admin-actions { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <div class="panel" style="display: block;">
        <div class="panel-header">
            <h2 style="color: #e53935;">⚙️ Panel de Programador</h2>
            <button class="btn-logout" id="btnSalirProg">Cerrar Sesión</button>
        </div>

        <!-- Login del programador (Oculto al inicio) -->
        <div id="loginProgBox" style="max-width: 400px; margin: 50px auto;">
            <form id="formLoginProg">
                <div class="form-group">
                    <label for="pNombre">Nombre</label>
                    <input type="text" id="pNombre" required>
                </div>
                <div class="form-group">
                    <label for="pRut">RUT</label>
                    <input type="text" id="pRut" required>
                </div>
                <div class="form-group">
                    <label for="pPass">Contraseña</label>
                    <input type="password" id="pPass" required>
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 10px; background: #e53935; border-color: #e53935; color: #fff;">Desbloquear Acceso</button>
                <div class="error-msg" id="errorProg" style="margin-top: 15px;"></div>
            </form>
        </div>

        <!-- Lista de clientes (Oculto hasta que se loguee) -->
        <div id="dashboardProg" style="display: none;">
            <h3>Base de Datos de Clientes</h3>
            <div id="listaClientesProg" style="margin-top: 20px;"></div>
        </div>
    </div>

    <!-- Modal Editar Cliente -->
    <div class="modal-overlay" id="modalEditarProg">
        <div class="modal-content" style="max-width: 500px;">
            <h3 style="color: #111; margin-bottom: 20px;">✏️ Editar Cliente (BD)</h3>
            <form id="formEditarProg">
                <input type="hidden" id="epRutOriginal">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="epNombre" required>
                    </div>
                    <div class="form-group">
                        <label>RUT</label>
                        <input type="text" id="epRut" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Edad</label>
                        <input type="number" id="epEdad" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" id="epTelefono" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="epEmail" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tipo de Piel</label>
                        <input type="text" id="epPiel" required>
                    </div>
                    <div class="form-group">
                        <label>Alergias</label>
                        <input type="text" id="epAlergias" required>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn-cancelar" id="btnCerrarEditarProg" style="flex: 1;">Cancelar</button>
                    <button type="submit" class="btn-primary" style="flex: 1; margin-bottom: 0;">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Eliminar -->
    <div class="modal-overlay" id="modalEliminar">
        <div class="modal-content" style="text-align: center; max-width: 400px;">
            <h3 style="color: #e53935; margin-bottom: 15px;" id="modalEliminarTitle">⚠️ Eliminar</h3>
            <p style="color: #555; margin-bottom: 25px; font-size: 15px;" id="modalEliminarText">¿Estás seguro?</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn-cancelar" id="btnCancelarEliminar" style="flex: 1; padding: 10px;">Cancelar</button>
                <button class="btn-primary" id="btnConfirmarEliminar" style="flex: 1; padding: 10px; background: #e53935; margin-bottom: 0; border: none;">Sí, eliminar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
