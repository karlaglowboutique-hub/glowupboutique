<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Glow Up Boutique</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="panel" style="display: block; max-width: 1000px;">
        <div class="panel-header">
            <h2 style="color: #111; font-family: 'Times New Roman', serif; letter-spacing: 2px;">⚙️ Panel de Programador</h2>
            <button class="btn-logout" id="btnSalirProg">Cerrar Sesión</button>
        </div>

        <div id="loginProgBox" style="max-width: 400px; margin: 50px auto;">
            <form id="formLoginProg">
                <div class="form-group"><label for="pEmail">Correo (Programador)</label><input type="email" id="pEmail" required></div>
                <div class="form-group"><label for="pPass">Contraseña</label><input type="password" id="pPass" required></div>
                <button type="submit" class="btn-primary">Desbloquear Acceso</button>
                <div class="error-msg" id="errorProg" style="margin-top: 15px;"></div>
            </form>
        </div>

        <div id="dashboardProg" style="display: none;">
            <h3>Base de Datos en la Nube</h3>
            <div id="listaClientesProg" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAynA1pU1npXEN_HvXNxTC4Xn7QB_SWyWg",
            authDomain: "glow-up-boutique-bdc0c.firebaseapp.com",
            projectId: "glow-up-boutique-bdc0c",
            storageBucket: "glow-up-boutique-bdc0c.firebasestorage.app",
            messagingSenderId: "372481623830",
            appId: "1:372481623830:web:e93a695c930f6a934ef237"
        };

        const app = initializeApp(firebaseConfig);
        window.firebaseDB = getFirestore(app); window.firebaseAuth = getAuth(app);
        const script = document.createElement('script'); script.src = "script.js"; script.type = "module"; document.body.appendChild(script);
    </script>
</body>
</html>
