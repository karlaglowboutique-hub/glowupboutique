<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Glow Up Boutique</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="panel" style="display: block; max-width: 1000px;">
        <div class="panel-header">
            <h2 style="color: #e53935;">⚙️ Panel de Programador</h2>
            <button class="btn-logout" id="btnSalirProg">Cerrar Sesión</button>
        </div>

        <!-- Login del programador (Oculto al inicio) -->
        <div id="loginProgBox" style="max-width: 400px; margin: 50px auto;">
            <form id="formLoginProg">
                <div class="form-group">
                    <label for="pNombre">Nombre</label>
                    <input type="text" id="pNombre" required>
                </div>
                <div class="form-group">
                    <label for="pRut">RUT</label>
                    <input type="text" id="pRut" required>
                </div>
                <div class="form-group">
                    <label for="pPass">Contraseña</label>
                    <input type="password" id="pPass" required>
                </div>
                <button type="submit" class="btn-primary" style="background: #e53935; border-color: #e53935; color: #fff;">Desbloquear Acceso</button>
                <div class="error-msg" id="errorProg" style="margin-top: 15px;"></div>
            </form>
        </div>

        <!-- Lista de clientes (Oculto hasta que se loguee) -->
        <div id="dashboardProg" style="display: none;">
            <h3>Base de Datos de Clientes</h3>
            <div id="listaClientesProg" style="margin-top: 20px;"></div>
        </div>
    </div>

    <!-- Modal Editar Cliente -->
    <div class="modal-overlay" id="modalEditarProg">
        <div class="modal-content" style="max-width: 500px;">
            <h3 style="color: #111; margin-bottom: 20px;">✏️ Editar Cliente (BD)</h3>
            <form id="formEditarProg">
                <input type="hidden" id="epRutOriginal">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="epNombre" required>
                    </div>
                    <div class="form-group">
                        <label>RUT</label>
                        <input type="text" id="epRut" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Edad</label>
                        <input type="number" id="epEdad" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" id="epTelefono" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="epEmail" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tipo de Piel</label>
                        <input type="text" id="epPiel" required>
                    </div>
                    <div class="form-group">
                        <label>Alergias</label>
                        <input type="text" id="epAlergias" required>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn-cancelar" id="btnCerrarEditarProg" style="flex: 1;">Cancelar</button>
                    <button type="submit" class="btn-primary" style="flex: 1; margin-bottom: 0;">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
